name: ci

# 每次提交强制门禁:pytest 全量 / ruff / mypy / ty
# 与 build-release.yml 互补(本工作流 push+PR 触发,发布仍走 tag 触发的 build-release.yml)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 新推送自动取消旧运行,省分钟

jobs:
  test:
    # Windows 与本地门禁/真机环境对齐:MX Component(comtypes)等仅 Windows 可用,
    # 34 个 mx 测试实跑而非跳过;纯 Python 库在 win/linux 行为一致
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # 与 build-release.yml 一致;仓库 .python-version 钉 3.7.9(本地开发用),
          # runner 无此解释器且 uv 托管下载不支持 3.7;测试本身在 3.12 跑(纯 Python
          # 库行为一致),py3.7 真兼容由本地门禁兜底
          python-version: "3.12"

      - name: Sync dev dependencies
        # dev 定义在 [project.optional-dependencies](extra),非 [dependency-groups],
        # 故必须用 --extra;--group dev 会报 "Group dev is not defined" 退出码 2(历史爆红根因)
        run: uv sync --extra dev

      - name: pytest
        run: uv run python -m pytest tests -q

      - name: ruff
        run: uvx ruff check src tests

      - name: mypy
        run: uvx mypy src/omniplc

      - name: ty
        # 第二类型检查器(Astral 的 Rust 实现的 mypy 替代):与 mypy 互补,
        # 抓不同的检查侧;mypy 守 3.7 兼容目标,ty 守更严格推断路径。
        # 配置见 pyproject.toml [tool.ty.src]
        run: uvx ty check src/omniplc