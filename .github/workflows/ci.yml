name: ci

# 每次提交强制门禁:pytest(3.7.9 + 3.12 双版本)/ ruff format / ruff / mypy / ty
# + audit job(pip-audit 依赖漏洞扫描,与 test 并行,见文件尾)
# 与 build-release.yml 互补(本工作流 push+PR 触发,发布仍走 tag 触发的 build-release.yml)
#
# 版本矩阵说明:项目 `requires-python = ">=3.7.9"`,`3.7` 是**必保**底线
# (现场老设备的 vendor SDK 依赖 3.7),故 CI 必须有真 3.7 腿;`3.12` 覆盖
# 新环境(现场能装 3.8~3.11 的设备同样兼容 3.12)。uv 托管下载不含 3.7,
# 故 3.7 腿改用 actions/setup-python 安装,并以 `UV_PYTHON_DOWNLOADS=never`
# 禁止 uv 静默替换版本;`.python-version` 钉 3.7.9 会覆盖 runner 默认,
# 因此 `uv sync`/`uv run` 一律显式带 `--python`。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 每周一 UTC 01:07(北京时间 09:07)定期空跑 master:门禁里 ruff/mypy/ty 走
    # uvx 不钉版本,工具链升级哪天打破检查只会在下一次 PR 才暴露,定期跑提前
    # 暴露(同类参考实现 / CodeQL 同款常态)。GitHub 定时触发只认默认分支(master)。
    - cron: '7 1 * * 1'
  workflow_dispatch: # 允许 Actions 页手动触发(改工作流后不推提交即可验证)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 新推送自动取消旧运行,省分钟

# actions 全部 SHA 钉版(review-1043 己-7,与 build-release.yml 同口径;
# 注释尾部标出钉版时对应的发布版本,SHA 经 GitHub API 由 tag 现解 2026-10-15)。

jobs:
  test:
    # 全部 windows-latest(2026-10-18 用户决策,反转 review-1043 己-1):
    # ubuntu 腿首次真实运行暴露平台差异(ctypes 64 位对齐 / 假 socket
    # 缺 recv_into / 浮点时序,见 f97c96e),维护成本高于声明面验证收益;
    # Windows 与本地门禁/真机环境对齐(MX Component/comtypes 等仅
    # Windows 可用,34 个 mx 测试实跑而非跳过),3.7 必保底线 + 3.12
    # 覆盖新环境;声明面(OS Independent)由纯 Python 特性保证。
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.7.9"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Sync dev dependencies
        # dev 定义在 [project.optional-dependencies](extra),非 [dependency-groups],
        # 故必须用 --extra;--group dev 会报 "Group dev is not defined" 退出码 2。
        # env 仅限本步:`never` 防 uv 静默换版本(3.7 无托管构建),但若设成 job 级会
        # 连 `uvx mypy` 的工具环境也挡住(它需要 ≥3.9 解释器)。
        # 锁文件不入库(review-1043 甲-4):本步在 runner 上现算解析(官方源);
        # `--frozen` 在无 lock 的检出里会直接失败,故不带。
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: pytest
        env:
          UV_PYTHON_DOWNLOADS: never
        # 必须带 --extra dev:否则 `uv run` 会按默认依赖重新同步、把上一步装的
        # extras(含 pytest)卸掉 → "No module named pytest"
        # review-1043 己-2:--cov 只出报告不卡门禁(无 fail-under),覆盖率数字
        # 供趋势观察与后续建档
        run: uv run --extra dev --python ${{ matrix.python-version }} python -m pytest tests -q --cov=omniplc --cov-report=term-missing

      - name: import under -W error
        env:
          UV_PYTHON_DOWNLOADS: never
        # review-1043 甲-6:无效转义序列(如 docstring 里的 `\{`)在 3.12+ 是
        # SyntaxWarning,客户用 `python -W error` 或 pytest filterwarnings=error
        # 时 `import omniplc` 直接失败(「装得上、一跑就炸」)。本步把整个包
        # 在 -W error 下导入一次,防复发(3.7 腿无此告警,属零成本冗余)
        run: uv run --extra dev --python ${{ matrix.python-version }} python -W error -c "import omniplc, omniplc.aio, omniplc.native"

      - name: ruff format
        # 格式零漂移门禁(2026-10-04 起;配置 pyproject [tool.ruff.format],
        # ruff 默认口径与 同类参考实现 对齐);Rust 独立二进制,两条腿都跑
        run: uvx ruff format --check src tests

      - name: ruff
        # Rust 独立二进制,不依赖解释器;两条腿都跑
        run: uvx ruff check src tests

      - name: mypy
        # 两条腿都跑;但固定在现代工具解释器(3.12)执行——3.7 腿若让 uvx 回退到
        # 3.7 时代的 mypy(mypy 1.4.1 + typed-ast),其 tokenizer 解析 UTF-8 中文
        # 源码会误报 `non-utf8 code starting with '\xc8'`。检查目标由 pyproject 的
        # python_version 决定;3.7 真兼容由 pytest 腿实跑验证
        run: uvx --python 3.12 mypy src/omniplc

      - name: ty
        # 第二类型检查器(Astral 的 Rust 实现的 mypy 替代):与 mypy 互补,
        # 抓不同的检查侧。配置见 pyproject.toml [tool.ty.src];两条腿都跑
        run: uvx ty check src/omniplc

  audit:
    # 依赖漏洞扫描(pip-audit):对现解析的依赖集查 PyPI 漏洞库。
    # 与上面五件套互补——五件套管"我们写的代码",本 job 管"我们装的依赖";
    # 与 test job 并行,每周一定时空跑也复用(新漏洞公告自动暴露)
    name: pip-audit
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        # 为下面 export 步的现算解析提供解释器(与 test job 同款:setup-python
        # 装的解释器可被 uv 发现)。2026-10-15 修复:原 audit job 无本步,
        # `uv export` 不带 --python 时按 .python-version 找 3.7.9 —— runner
        # 无该解释器、uv 托管下载也不支持 3.7,步骤必失败(实测复现:
        # `error: No interpreter found for Python 3.7.9 in managed
        # installations, search path, or registry`;本地无 .venv 的干净检出
        # 同样复现)。这是 review-1043 甲-4 去掉 --frozen 时引入的回归。
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Export dependencies
        # 锁文件不入库(2026-10-15 review-1043 甲-4:本机 UV_DEFAULT_INDEX 指向
        # 国内镜像,lock 入库即把镜像写进发布物与客户复现路径)⇒ 本步按
        # pyproject 现算解析结果(无镜像的 runner 环境即官方源),不再 --frozen;
        # **无 lock 时 export 需解析、必须显式 --python**(否则按 .python-version
        # 选 3.7.9 必失败,见上面 Setup 步注释),3.12 由 setup-python 提供;
        # env 只限本步:never 防 uv 对托管不支持的 3.7 静默下载,但设成 job
        # 级会挡住下面 pip-audit 步对 3.13 的托管获取(与 test 步同纪律);
        # --no-emit-project 排除 omniplc 自身(开发期未发布版本号在 PyPI 查不到,
        # 会误报包缺失);--extra dev 与门禁环境同口径(dev 定义在
        # [project.optional-dependencies],非 [dependency-groups],见上面 sync 步说明)
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv export --no-hashes --format requirements-txt --extra dev --no-emit-project --python 3.12 -o requirements-audit.txt

      - name: pip-audit
        # runner 必须是 windows:comtypes 带 sys_platform=='win32' 标记,linux
        # 审计环境会把这行整条跳过、漏审运行时依赖;与 test job 平台口径一致。
        # --disable-pip --no-deps:导出全为 name==version 钉死行,免 venv 解析
        # (pip-audit 的解析模式在 uv 托管解释器上自升级 pip 会失败);
        # --python 3.13 使环境标记求值确定:只审 >=3.10 + win32 腿——运行时
        # 依赖(asyncua/comtypes/pyserial 及传递)全在此。3.7~3.9 腿仅测试
        # 工具版本差异,不在范围(已知 3.9 腿 pytest 8.4.2 有 PYSEC-2026-1845,
        # 修复版 pytest 9 不支持 3.9;dev-only,门禁两腿用 7.4.4/9.1.1 均干净)
        run: uvx --python 3.13 pip-audit --disable-pip --no-deps --strict -r requirements-audit.txt
