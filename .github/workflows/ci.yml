name: ci

# 每次提交强制门禁:pytest(3.7.9 + 3.12 双版本)/ ruff / mypy / ty
# 与 build-release.yml 互补(本工作流 push+PR 触发,发布仍走 tag 触发的 build-release.yml)
#
# 版本矩阵说明:项目 `requires-python = ">=3.7.9"`,`3.7` 是**必保**底线
# (现场老设备的 vendor SDK 依赖 3.7),故 CI 必须有真 3.7 腿;`3.12` 覆盖
# 新环境(现场能装 3.8~3.11 的设备同样兼容 3.12)。uv 托管下载不含 3.7,
# 故 3.7 腿改用 actions/setup-python 安装,并以 `UV_PYTHON_DOWNLOADS=never`
# 禁止 uv 静默替换版本;`.python-version` 钉 3.7.9 会覆盖 runner 默认,
# 因此 `uv sync`/`uv run` 一律显式带 `--python`。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 新推送自动取消旧运行,省分钟

jobs:
  test:
    # Windows 与本地门禁/真机环境对齐:MX Component(comtypes)等仅 Windows 可用,
    # 34 个 mx 测试实跑而非跳过;纯 Python 库在 win/linux 行为一致
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7.9", "3.12"]
    env:
      # 禁止 uv 自动下载解释器:3.7 无托管构建,找不到即失败,绝不静默换版本
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dev dependencies
        # dev 定义在 [project.optional-dependencies](extra),非 [dependency-groups],
        # 故必须用 --extra;--group dev 会报 "Group dev is not defined" 退出码 2
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: pytest
        run: uv run --python ${{ matrix.python-version }} python -m pytest tests -q

      - name: ruff
        # 静态检查与目标解释器无关,仅在 3.12 腿跑一遍,省 CI 分钟
        if: matrix.python-version == '3.12'
        run: uvx ruff check src tests

      - name: mypy
        # mypy 目标为 3.9(新版 mypy 最低支持),py3.7 真兼容由 3.7 腿实跑测试验证
        if: matrix.python-version == '3.12'
        run: uvx mypy src/omniplc

      - name: ty
        # 第二类型检查器(Astral 的 Rust 实现的 mypy 替代):与 mypy 互补,
        # 抓不同的检查侧;mypy 守 3.7 兼容目标,ty 守更严格推断路径。
        # 配置见 pyproject.toml [tool.ty.src]
        if: matrix.python-version == '3.12'
        run: uvx ty check src/omniplc
