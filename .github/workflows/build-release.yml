name: build-release

# 打标签推送后自动构建并发布:
#   git push origin v0.32.0 && git push --tags
# 触发条件为版本号标签(v*):构建 sdist + wheel,挂到对应 GitHub Release,
# 并发布到 PyPI(可信发布/OIDC,无需明文令牌)。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 GitHub Release 并上传构件需要

jobs:
  build:
    name: uv build
    # 与 ci.yml 对齐 Windows 平台;产物为 py3-none-any,平台无关
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # 仓库 .python-version 钉 3.7.9(本地开发用),runner 无此解释器且 uv
          # 托管下载不支持 3.7;构建本身与运行版本无关(hatchling 纯 Python,
          # wheel 为 py3-none-any),这里预装 3.12 供 uv build 使用
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build --python 3.12

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniplc-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          # 显式只发布分发包:uv build 会在 dist/ 生成 .gitignore(内容 *,
          # 防产物污染 VCS),通配 dist/* 会把它一并挂上 Release
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # 仅主仓库发布,防止 fork 误触
    if: github.repository == 'yunluo/omniplc'
    permissions:
      id-token: write # 信任发布(OIDC)需要;PyPI 侧配置可信发布者后无需任何令牌
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: omniplc-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
