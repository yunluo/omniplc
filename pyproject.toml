[project]
name = "omniplc"
version = "0.27.0"
description = "omniplc —— 多品牌多协议 PLC 统一通信库(Modbus / 三菱 MC 3E/4E/1E 与串口 3C/4C / MX Component / 欧姆龙 FINS / NJ/NX CIP / 基恩士 KV Host Link / KV MC 兼容 / 汇川 H3U/H5U / 松下 MC 兼容与 MEWTOCOL / 丰田 TOYOPUC / AB EtherNet/IP / 倍福 TwinCAT ADS / 西门子 S7 / OPC-UA / 通用自定义 TCP / CNC MTConnect)"
readme = "README.md"
requires-python = ">=3.7.9"
license = { text = "MIT" }
authors = [{ name = "云落" }]
keywords = [
    "plc",
    "modbus",
    "mc-protocol",
    "slmp",
    "fins",
    "hostlink",
    "keyence",
    "inovance",
    "h3u",
    "h5u",
    "panasonic",
    "mewtocol",
    "melsec",
    "mitsubishi",
    "mc-serial",
    "allen-bradley",
    "ethernet-ip",
    "cip",
    "controllogix",
    "beckhoff",
    "twincat",
    "ads",
    "pyads",
    "siemens",
    "s7",
    "snap7",
    "s7comm",
    "omron",
    "opcua",
    "opc-ua",
    "cnc",
    "mtconnect",
    "fanuc",
    "toyopuc",
    "industrial",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
mx = ["comtypes>=1.2; platform_system == 'Windows'"]
opcua = ["asyncua==1.1.5"]
ads = ["pyads==3.5.1"]
# S7 依赖按解释器版本二选一(pip/uv 环境标记自动生效,目标环境 3.7 与 3.12
# 各取一线):
#   3.7~3.9 → python-snap7 1.3:C 库封装末版线,64 位 wheel 捆绑原生 DLL,
#             32 位 Python 经 dll_path 自备;1.3 导入期 import pkg_resources,
#             uv venv 默认无 setuptools,故标记内显式带上。
#   3.10+  → python-snap7 3.x:3.0 起纯 Python 实现,不再需要原生 DLL,
#             官方最低要求 3.10;2.x 线(仅 py3.9,仍 C 封装)窗口窄不单独适配。
s7 = [
    "python-snap7==1.3; python_version < '3.10'",
    "setuptools; python_version < '3.10'",
    "python-snap7>=3.0; python_version >= '3.10'",
]
dev = [
    "pyserial>=3.5",
    "pytest>=7.4.4",
    "comtypes>=1.2",
    "asyncua==1.1.5",
    "pyads==3.5.1",
    "python-snap7==1.3; python_version < '3.10'",
    "setuptools; python_version < '3.10'",
    "python-snap7>=3.0; python_version >= '3.10'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniplc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ruff 门禁显式固定为历史口径(旧版 ruff 的默认规则集):新版 ruff 扩大
# 默认规则后会误报 UP/I/B/RUF 等非本项目启用的规则(其中含要求
# py3.9+/3.10+ 语法的改写建议,与 requires-python >=3.7 冲突),
# 故显式圈定,使门禁与 ruff 版本漂移解耦。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# 新版 mypy 最低支持 3.9 目标(3.7 已弃用);py3.7 真兼容由 py3.7 运行时
# 实跑测试验证(mypy 目标仅静态兜底,不能替代真机验证)。
python_version = "3.9"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# 可选运行时依赖 serial(串口扩展)/comtypes(MX Component 扩展)/
# asyncua(OPC-UA 扩展)/pyads(TwinCAT ADS 扩展)/python-snap7(S7 扩展)
# 无内联标注;
# pytest 视宿主环境可能缺失:均按缺失导入处理,不影响核心代码检查。
[[tool.mypy.overrides]]
module = [
    "serial",
    "comtypes",
    "comtypes.client",
    "asyncua",
    "asyncua.sync",
    "asyncua.ua",
    "pyads",
    "snap7",
    "snap7.client",
    "snap7.type",
    "snap7.types",
    "pytest",
]
ignore_missing_imports = true

[tool.ty.src]
include = ["src", "tests"]
