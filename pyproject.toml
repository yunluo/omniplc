[project]
name = "omniplc"
version = "0.1.0"
description = "omniplc —— 多品牌多协议 PLC 统一通信库(Modbus / 三菱 MC 3E/4E/1E 与串口 3C/4C / MX Component / 欧姆龙 FINS / 基恩士 KV Host Link / KV MC 兼容 / 汇川 H3U/H5U / 松下 MC 兼容与 MEWTOCOL / 丰田 TOYOPUC / OPC-UA)"
readme = "README.md"
requires-python = ">=3.7.9"
license = { text = "MIT" }
authors = [{ name = "云落" }]
keywords = [
    "plc",
    "modbus",
    "mc-protocol",
    "slmp",
    "fins",
    "hostlink",
    "keyence",
    "inovance",
    "h3u",
    "h5u",
    "panasonic",
    "mewtocol",
    "melsec",
    "mitsubishi",
    "mc-serial",
    "omron",
    "opcua",
    "opc-ua",
    "toyopuc",
    "industrial",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
mx = ["comtypes>=1.2; platform_system == 'Windows'"]
opcua = ["asyncua==1.1.5"]
dev = [
    "pyserial>=3.5",
    "pytest>=7.4.4",
    "comtypes>=1.2",
    "asyncua==1.1.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniplc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.7"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# 可选运行时依赖 serial(串口扩展)/comtypes(MX Component 扩展)/
# asyncua(OPC-UA 扩展)无内联标注;
# pytest 视宿主环境可能缺失:均按缺失导入处理,不影响核心代码检查。
[[tool.mypy.overrides]]
module = [
    "serial",
    "comtypes",
    "comtypes.client",
    "asyncua",
    "asyncua.sync",
    "asyncua.ua",
    "pytest",
]
ignore_missing_imports = true

[tool.ty.src]
include = ["src", "tests"]
