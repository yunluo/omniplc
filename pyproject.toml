[project]
name = "omniplc"
version = "0.55.4"
description = "omniplc:多品牌多协议 PLC 统一通信库(Modbus / 三菱 MC 3E/4E/1E 与串口 1C/3C/4C / MX Component / 欧姆龙 FINS / NJ/NX CIP / 基恩士 KV Host Link / KV MC 兼容 / 汇川 H3U/H5U / 松下 MC 兼容与 MEWTOCOL / 丰田 TOYOPUC / AB EtherNet/IP / 西门子 S7 / OPC-UA / CNC MTConnect / 发那科 FOCAS / 三菱 EZSocket)"
readme = "README.md"
requires-python = ">=3.7.9"
license = { text = "MIT" }
authors = [{ name = "云落" }]
keywords = [
    "plc",
    "modbus",
    "mc-protocol",
    "slmp",
    "fins",
    "hostlink",
    "keyence",
    "inovance",
    "h3u",
    "h5u",
    "panasonic",
    "mewtocol",
    "melsec",
    "mitsubishi",
    "mc-serial",
    "allen-bradley",
    "ethernet-ip",
    "cip",
    "controllogix",
    "siemens",
    "s7",
    "s7comm",
    "omron",
    "opcua",
    "opc-ua",
    "cnc",
    "mtconnect",
    "fanuc",
    "toyopuc",
    "industrial",
    "automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial==3.5"]
mx = ["comtypes==1.4.6; platform_system == 'Windows'"]
opcua = ["asyncua==1.1.5"]
# v0.53:S7 驱动自研 S7comm 协议栈(直接替换 同类开源封装 封装),s7 extra
# 退役——S7 客户端进核心,零第三方依赖(同类开源封装(1.3)/3.x 双轨线随之撤销)。
dev = [
    "pyserial==3.5",
    "pytest>=7.4.4",
    "pytest-timeout>=2.1",
    "comtypes==1.4.6; platform_system == 'Windows'",
    "asyncua==1.1.5",
]
# all = 全部可选运行时依赖(serial/mx/opcua 三件),一键安装全套扩展
# 驱动;与 dev 的差异仅在于不含 pytest 测试工具。显式罗列而非自引用 extras
# (omniplc[...]),兼容老版本 pip/uv 的元数据解析。
all = [
    "pyserial==3.5",
    "comtypes==1.4.6; platform_system == 'Windows'",
    "asyncua==1.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniplc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 防卡死:任一用例超过 120s 判失败(thread 法,Windows 可配合);真机/慢链路
# 用例如需放宽,就近用 @pytest.mark.timeout(...)。3.7 兼容由 pytest-timeout 解析。
timeout = 120
timeout_method = "thread"

# ruff 门禁显式固定为历史口径(旧版 ruff 的默认规则集):新版 ruff 扩大
# 默认规则后会误报 UP/I/B/RUF 等非本项目启用的规则(其中含要求
# py3.9+/3.10+ 语法的改写建议,与 requires-python >=3.7 冲突),
# 故显式圈定,使门禁与 ruff 版本漂移解耦。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# ruff format 统一格式化(2026-10-04 用户决议,与门禁 `ruff format --check`
# 配套):配置与 同类参考实现 对齐,四项均为 ruff 默认值,显式落盘固化口径,
# 防上游默认漂移(quote/indent/尾逗号/换行符)。
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# 新版 mypy 最低支持 3.10 目标(3.7/3.8/3.9 均已不支持);3.7 语法兼容由
# ruff 的 target-version 推导(requires-python >=3.7.9 → py37)兜底,运行期
# 兼容由 3.7.9 测试腿实跑验证(mypy 目标仅静态兜底,不替代真机验证)。
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# 可选运行时依赖 serial(串口扩展)/comtypes(MX Component 扩展)/
# asyncua(OPC-UA 扩展)
# 无内联标注;
# pytest 视宿主环境可能缺失:均按缺失导入处理,不影响核心代码检查。
# (v0.53:S7 自研栈进核心,同类开源封装 overrides 随依赖退役移除。)
[[tool.mypy.overrides]]
module = [
    "serial",
    "comtypes",
    "comtypes.client",
    "comtypes.automation",
    "asyncua",
    "asyncua.sync",
    "asyncua.ua",
    "pytest",
]
ignore_missing_imports = true

[tool.ty.src]
include = ["src", "tests"]
